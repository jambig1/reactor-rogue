<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reactor Rogue — model review</title><style>body{margin:0;background:#080e1b;color:#e4f2ff;font:16px system-ui}header{padding:18px 24px}h1{font-size:24px;margin:8px 0}label{display:inline-block;margin:8px}select,input,button{accent-color:#65fbd2;background:#19293c;color:#e4f2ff;padding:8px;border:1px solid #455b70}main{display:grid;grid-template-columns:1fr 1fr}article{text-align:center;background:radial-gradient(ellipse,#20364a 0%,#0b1322 65%);min-width:0}canvas{width:100%;height:440px;display:block}h2{font-size:16px;color:#9eb7cc}p{color:#9eb7cc} @media(max-width:700px){main{grid-template-columns:1fr}canvas{height:310px}}</style><header><p>REACTOR ROGUE / 3D MODEL STUDY</p><h1>Fleet inspection</h1><label>Ship <select id="ship"></select></label><label>Yaw <input id="yaw" type="range" min="-180" max="180" value="-30"></label><label>Pitch <input id="pitch" type="range" min="-180" max="180" value="0"></label><label><input id="bloom" type="checkbox" checked> Bloom</label><button id="top">Top</button> <button id="side">Side</button> <button id="under">Underside</button><p id="status">Loading production models…</p></header><main><article><h2>EXISTING · MAIN BRANCH</h2><canvas id="before"></canvas></article><article><h2 id="afterLabel">VANGUARD BENCHMARK / OTHER SHIPS UNCHANGED</h2><canvas id="after"></canvas></article></main><script type="module">
import {createShip3D} from './ship3d-v1100.js';
import {createShip3D as createBefore} from './ship3d-baseline.js';
const records=await(await fetch('./ship-review-records.json')).json();
const $=id=>document.getElementById(id);for(const p of records){let o=document.createElement('option');o.value=p.id;o.textContent=p.name;$('ship').append(o)}$('ship').value='vanguard';
const views=await Promise.all([createBefore($('before')),createShip3D($('after'))]);
function update(){let p=records.find(p=>p.id===$('ship').value);views.forEach(v=>v.setShip(JSON.stringify([p.id,p.rec.color,{engine:'e_stock',wings:'w_stock',mount:'m_stock',plating:'p_stock'}]),structuredClone(p.rec)));$('status').textContent=p.name+' · stock fittings · shared lighting and camera · no save access';}update();$('ship').onchange=update;
window.shipReview={views,records,update};
$('top').onclick=()=>{$('pitch').value=-32;$('yaw').value=0};$('side').onclick=()=>{$('pitch').value=58;$('yaw').value=90};$('under').onclick=()=>{$('pitch').value=148;$('yaw').value=-25};
function frame(t){views.forEach((v,i)=>{let c=$(i?'after':'before'),w=c.clientWidth,h=c.clientHeight;v.resize(w,h,Math.min(2,devicePixelRatio));v.render({x:w/2,y:h*.5,scale:Math.min(w/100,h/85),yaw:(+$('yaw').value)*Math.PI/180,pitch:+$('pitch').value*Math.PI/180,roll:0,appear:1,thrust:.15,t:t/1000,bloom:$('bloom').checked,glow:.65})});requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
