<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reactor Rogue — menu viewport checks</title><style>body{margin:0;background:#030916;color:#dceef4;font:12px monospace}header{padding:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{background:#143541;color:#dceef4;border:1px solid #65ac9f;padding:9px;cursor:pointer}button[aria-pressed=true]{background:#8ce6cd;color:#071c28}#stage{margin:0 auto;position:relative}iframe{border:1px solid #426777;transform-origin:top left;background:#07101f}p{margin:0 14px 10px;color:#9eb8c9}</style><header><b>MENU VIEWPORT CHECKS</b><button data-size="1280,800,0.9">Desktop</button><button data-size="768,1024,0.75">Tablet</button><button data-size="390,844,0.9">Phone</button><button data-size="320,568,1">Small phone</button><button data-size="844,390,1">Phone landscape</button><button id="reload">Reload game</button><output id="size"></output></header><p>Development tool. Uses normal game controls and this browser’s existing save. CSS viewport checks only; does not emulate Safari, touch hardware or device FPS.</p><div id="stage"><iframe title="Game viewport" src="index.html?menu-review=0310"></iframe></div><script>const frame=document.querySelector('iframe'),stage=document.querySelector('#stage');function size(b){let[w,h,z]=b.dataset.size.split(',').map(Number);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+z+')';stage.style.width=w*z+'px';stage.style.height=h*z+'px';document.querySelector('#size').textContent=w+' × '+h;document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>size(b));document.querySelector('#reload').onclick=()=>frame.src='index.html?menu-review='+Date.now();size(document.querySelector('[data-size]'));</script></html>
