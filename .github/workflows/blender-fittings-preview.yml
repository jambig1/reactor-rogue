name: Export and validate Blender fittings
on:
  push:
    branches: [codex/blender-detail-and-fittings]
    paths:
      - '.github/workflows/blender-fittings-preview.yml'
      - 'art/blender/*.py'
      - 'art/blender/check-fleet.mjs'
      - 'ship3d-blender.js'
      - 'ship3d-v1100.js'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install bpy==4.5.16
      - name: Sculpt and export the hulls and fittings
        run: |
          python art/blender/author-fleet.py -- art/blender
          python art/blender/author-fittings.py -- art/blender
      - name: Validate individual and fully equipped loadouts
        run: node art/blender/check-fleet.mjs
      - name: Publish GLBs to the test branch
        run: |
          git rm --ignore-unmatch ':(glob)art/blender/fittings/*.glb'
          git add art/blender/*.glb art/blender/fittings
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Export the detailed Blender hulls and all 16 fittings'
          git push origin HEAD:refs/heads/codex/blender-detail-and-fittings
