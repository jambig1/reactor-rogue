name: Ship WebGL validation
on:
  push:
    branches: [codex/vanguard-3d-benchmark]
  pull_request:
    paths:
      - 'ship3d-v1100.js'
      - 'vanguard-model.js'
      - 'ship-review*'
      - 'TEST-SHIP-WEBGL.cjs'
      - '.github/workflows/ship-webgl.yml'
permissions:
  contents: read
concurrency:
  group: ship-webgl-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1 pngjs@7.0.0
      - run: npx playwright install --with-deps chromium webkit
      - run: node TEST-VANGUARD-3D.mjs && node TEST-SHIP-PREVIEWS.cjs
      - name: Real WebGL browser checks
        run: xvfb-run -a node TEST-SHIP-WEBGL.cjs
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ship-webgl-evidence
          path: ship-webgl-results/
          retention-days: 14
