name: Blender ship proof
on:
  push:
    branches: [codex/blender-wasp]
    paths:
      - 'art/blender/wasp.py'
      - '.github/workflows/blender-ship.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install bpy==4.5.16
      - run: python art/blender/wasp.py -- "$PWD/blender-export"
        env:
          OMP_NUM_THREADS: '4'
      - uses: actions/upload-artifact@v4
        with:
          name: wasp-blender-proof
          path: blender-export/
          if-no-files-found: error
