name: Blender ship proof
on:
  push:
    branches: [codex/blender-wasp]
    paths:
      - 'art/blender/wasp.py'
      - '.github/workflows/blender-ship.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y blender
      - run: blender --background --factory-startup --threads 4 --python-exit-code 1 --python art/blender/wasp.py -- "$PWD/blender-export"
      - uses: actions/upload-artifact@v4
        with:
          name: wasp-blender-proof
          path: blender-export/
          if-no-files-found: error
