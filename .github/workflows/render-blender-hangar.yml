name: Render Blender hangar preview
on:
  push:
    branches: [codex/blender-hangar-redesign]
    paths:
      - 'art/blender/author-hangar.py'
      - '.github/workflows/render-blender-hangar.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install bpy==4.5.16 pillow
      - run: python art/blender/author-hangar.py -- "${RUNNER_TEMP}/hangar"
      - name: Optimise the render and integrate it with the ship viewer
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image

          render = Image.open(Path(os.environ["RUNNER_TEMP"]) / "hangar" / "Hangar.png")
          assert render.size == (1200, 800)
          asset = Path("art/blender/flight-deck.webp")
          render.convert("RGB").save(asset, quality=89, method=6)
          assert 10_000 < asset.stat().st_size < 450_000
          index = Path("index.html")
          html = index.read_bytes()
          old = b"hangarImg.src='hangar-bay-v0990.webp'"
          new = b"hangarImg.src='art/blender/flight-deck.webp'"
          if old in html:
              assert html.count(old) == 1
              index.write_bytes(html.replace(old,new,1))
          else:
              assert html.count(new) == 1
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: blender-hangar-source-and-render
          path: ${{ runner.temp }}/hangar/
      - name: Publish the preview asset
        run: |
          git add index.html art/blender/flight-deck.webp
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Stage the Blender flight deck in the ship viewer'
          git push origin HEAD:refs/heads/codex/blender-hangar-redesign

