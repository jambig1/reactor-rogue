name: Build and validate Blender fleet
on:
  push:
    branches: [codex/blender-fleet-hangar]
    paths:
      - '.github/workflows/fleet-hangar-assets.yml'
      - 'art/blender/author-fleet.py'
      - 'art/blender/check-fleet.mjs'
      - 'ship3d-blender.js'
      - 'ship3d-fitting-finish.js'
permissions:
  contents: write
jobs:
  fleet:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install bpy==4.5.16
      - name: Export the fleet from Blender
        run: python art/blender/author-fleet.py -- art/blender
      - name: Verify hulls, material overrides and loadout combinations
        run: node art/blender/check-fleet.mjs
      - name: Stage assets on the preview branch
        run: |
          git add art/blender/*.glb
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Export the detailed Blender hangar fleet'
          git push origin HEAD:refs/heads/codex/blender-fleet-hangar

