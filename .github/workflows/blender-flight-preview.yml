name: Prepare flight-model playtest
on:
  push:
    branches: [codex/blender-detail-and-fittings]
    paths: ['.github/workflows/blender-flight-preview.yml','art/blender/integrate-flight-preview.py']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Integrate cached ship rendering with combat
        run: |
          python art/blender/integrate-flight-preview.py
          node --check ship3d-flight.js
          git diff --check
          git rm art/blender/integrate-flight-preview.py
          git add index.html
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Use the Blender ship loadout during combat'
          git push origin HEAD:refs/heads/codex/blender-detail-and-fittings
