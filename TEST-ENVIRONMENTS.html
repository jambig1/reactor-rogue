<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reactor Rogue environment review</title><style>body{background:#080e1b;color:#e6f4ff;font:15px Arial;margin:24px}header{max-width:1320px;margin:auto}h1{color:#82f7d7}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:1320px;margin:auto}article{border:1px solid #385065;border-radius:10px;overflow:hidden;background:#132035}h2{font-size:16px;padding:0 16px}canvas{display:block;width:100%;height:auto}p{color:#a5b8ca}@media(max-width:700px){main{grid-template-columns:1fr}}</style><header><p>REACTOR ROGUE / ENVIRONMENT REVIEW</p><h1>Shaded surfaces. Softer light. Real depth.</h1><p>Actual scenery renderers with representative ships and contrast markers. Development review scene, not a captured run.</p></header><main><article><h2>Neon Expanse</h2><canvas width="640" height="380" data-sector="grid"></canvas></article><article><h2>Shattered Belt</h2><canvas width="640" height="380" data-sector="belt"></canvas></article><article><h2>Storm Relay</h2><canvas width="640" height="380" data-sector="storm"></canvas></article><article><h2>Cinder Foundry</h2><canvas width="640" height="380" data-sector="foundry"></canvas></article><article><h2>Cryo Reach</h2><canvas width="640" height="380" data-sector="cryo"></canvas></article><article><h2>Neon Undercity</h2><canvas width="640" height="380" data-sector="city"></canvas></article></main><script>let ctx,W=640,H=380,s,reducedMotion=false,TAU=Math.PI*2,graphics={preset:'high'},graphicsCrowd={active:false},graphicsVisual={explosions:'detailed'};const environmentPalettes={"grid":["#4bbaa4","#554898","#102934"],"belt":["#be865a","#654666","#302126"],"storm":["#8a6bcc","#4e8ba8","#201a3c"],"foundry":["#c86646","#8a436b","#321e2a"],"cryo":["#75b4ce","#4d6fba","#152e40"],"city":["#af5cba","#4aa1b0","#231b3c"]},fleetHullProfiles={"wasp":[[0,-27],[7,-9],[22,12],[19,22],[6,14],[0,20],[-6,14],[-19,22],[-22,12],[-7,-9]],"vanguard":[[0,-26],[10,-12],[12,-2],[24,10],[21,19],[9,15],[0,23],[-9,15],[-21,19],[-24,10],[-12,-2],[-10,-12]],"bastion":[[-9,-22],[9,-22],[15,-15],[23,-12],[25,14],[16,22],[-16,22],[-25,14],[-23,-12],[-15,-15]],"harrier":[[0,-24],[8,-9],[15,-25],[20,-21],[17,17],[8,21],[0,13],[-8,21],[-17,17],[-20,-21],[-15,-25],[-8,-9]],"glacier":[[0,-27],[9,-10],[26,0],[13,16],[0,23],[-13,16],[-26,0],[-9,-10]],"tempest":[[0,-24],[8,-8],[25,-17],[19,5],[26,19],[8,13],[0,22],[-8,13],[-26,19],[-19,5],[-25,-17],[-8,-8]],"scavenger":[[-5,-23],[8,-20],[13,-9],[23,-6],[24,14],[11,19],[0,22],[-23,17],[-26,-9],[-12,-13]],"spectre":[[0,-29],[6,-9],[19,20],[6,15],[0,24],[-6,15],[-19,20],[-6,-9]],"architect":[[-8,-21],[8,-21],[11,-12],[23,-19],[23,20],[12,20],[8,13],[-8,13],[-12,20],[-23,20],[-23,-19],[-11,-12]],"helios":[[0,-25],[8,-9],[25,-17],[21,13],[12,22],[0,16],[-12,22],[-21,13],[-25,-17],[-8,-9]],"echo":[[0,-22],[9,-11],[21,-8],[24,4],[16,16],[7,14],[0,24],[-7,14],[-16,16],[-24,4],[-21,-8],[-9,-11]],"sovereign":[[0,-29],[10,-17],[16,-14],[30,-21],[26,16],[17,25],[8,20],[0,29],[-8,20],[-17,25],[-26,16],[-30,-21],[-16,-14],[-10,-17]]},environmentAtmospheres=new Map,paintedScenery={tiles:new Map,limit:24,size:640},cityScenery={tiles:new Map,cloud:null,traffic:new Map};function graphicsDetailed(){return true}function graphicsShadow(){return 0}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function poly(...a){return shipPainter(ctx).poly(...a)}function circle(...a){return shipPainter(ctx).circle(...a)}function hex(...a){return shipPainter(ctx).hex(...a)}function lineLocal(...a){return shipPainter(ctx).lineLocal(...a)}
function sceneryShape(c,points,fill){c.beginPath();points.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fillStyle=fill;c.fill()}
function sceneryGlow(c,x,y,r,color,alpha=.3){let g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color+Math.round(alpha*255).toString(16).padStart(2,'0'));g.addColorStop(.4,color+Math.round(alpha*70).toString(16).padStart(2,'0'));g.addColorStop(1,color+'00');c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2)}
function sceneryRock(c,x,y,r,seed,ice=false){c.save();c.translate(x,y);c.rotate(seed*TAU);let n=ice?11:15,points=Array.from({length:n},(_,i)=>{let a=i*TAU/n,k=.72+cityHash(i,Math.floor(seed*1000),41)*.28;return [Math.cos(a)*r*k,Math.sin(a)*r*k*.75]});c.save();c.translate(12,18);sceneryShape(c,points,'#030913');c.restore();let g=c.createLinearGradient(-r,-r,r,r);g.addColorStop(0,ice?'#284356':'#4c3b3a');g.addColorStop(.45,ice?'#152c3d':'#292129');g.addColorStop(1,'#0b111d');sceneryShape(c,points,g);
// Broad illuminated facets, smaller erosion marks and soft mineral deposits.
for(let i=0;i<n;i++){let a=points[i],b=points[(i+1)%n];sceneryShape(c,[a,b,[r*.08,-r*.13]],i%3===0?(ice?'#90bdd30b':'#c6a07a0c'):'#030a1308')}
for(let i=0;i<(ice?7:12);i++){let q=cityHash(i,Math.floor(seed*800),93),a=i*2.399,xx=Math.cos(a)*r*q*.65,yy=Math.sin(a)*r*q*.45,rr=r*(.035+q*.08);if(ice){sceneryGlow(c,xx,yy,rr*3,'#80bcd4',.06)}else{let crater=c.createRadialGradient(xx-rr*.2,yy-rr*.3,0,xx,yy,rr);crater.addColorStop(0,'#090e18a0');crater.addColorStop(.75,'#15162270');crater.addColorStop(1,'#9a786b10');c.fillStyle=crater;c.beginPath();c.ellipse(xx,yy,rr,rr*.7,0,0,TAU);c.fill()}}
if(ice){c.beginPath();c.moveTo(-r*.7,-r*.15);c.bezierCurveTo(-r*.3,-r*.3,-r*.2,r*.3,r*.1,r*.1);c.bezierCurveTo(r*.4,-r*.1,r*.5,r*.2,r*.7,r*.1);c.strokeStyle='#70a2be30';c.lineWidth=2;c.stroke();sceneryGlow(c,-r*.2,-r*.25,r*.7,'#69a7cf',.06)}c.restore()}
function sceneryPlatform(c,x,y,w,h,seed,hot=false){c.save();c.translate(x,y);c.rotate(Math.floor(seed*4)*Math.PI/2);c.fillStyle='#030814aa';c.fillRect(-w/2+14,-h/2+18,w,h);let g=c.createLinearGradient(-w/2,-h/2,w/2,h/2);g.addColorStop(0,hot?'#453038':'#273345');g.addColorStop(.28,hot?'#251d29':'#141f30');g.addColorStop(1,'#0b1120');c.fillStyle=g;c.beginPath();c.roundRect(-w/2,-h/2,w,h,Math.min(w,h)*.12);c.fill();c.fillStyle=hot?'#77514635':'#658d9630';c.fillRect(-w/2+12,-h/2+5,w-24,2);c.fillStyle='#020a14';c.beginPath();c.roundRect(-w*.32,-h*.32,w*.64,h*.64,12);c.fill();
if(hot){let f=c.createLinearGradient(0,-h*.3,0,h*.3);f.addColorStop(0,'#4d1f23');f.addColorStop(.5,'#b755302e');f.addColorStop(1,'#291722');c.fillStyle=f;c.fillRect(-w*.29,-h*.28,w*.58,h*.56);for(let j=0;j<5;j++){c.fillStyle='#080c18';c.fillRect(-w*.33,-h*.25+j*h*.12,w*.66,5)}sceneryGlow(c,0,0,Math.max(w,h)*.65,'#e46d41',.1)}else{c.fillStyle='#152b36';c.beginPath();c.ellipse(0,0,w*.2,h*.22,0,0,TAU);c.fill();sceneryGlow(c,0,0,Math.max(w,h)*.5,'#61cbb7',.1)}
for(let side of [-1,1]){c.fillStyle=hot?'#efa67270':'#8bdcc870';c.fillRect(side*(w/2-12)-1,-h*.25,2,h*.22);sceneryGlow(c,side*(w/2-12),0,h*.3,hot?'#c87552':'#62b5bd',.09)}c.restore()}
function sceneryCityBlock(c,x,y,seed){c.save();c.translate(x,y);let w=65+seed*52,h=60+cityHash(x,y,18)*60;let horizontal=cityHash(x,y,8)>.5;if(horizontal)[w,h]=[h,w];let g=c.createLinearGradient(-w/2,-h/2,w/2,h/2);g.addColorStop(0,'#393047');g.addColorStop(.18,'#232337');g.addColorStop(1,'#0b1322');c.fillStyle='#030915bb';c.fillRect(-w/2+9,-h/2+13,w,h);c.fillStyle=g;c.beginPath();c.roundRect(-w/2,-h/2,w,h,4+seed*7);c.fill();c.fillStyle='#11192a';c.fillRect(-w*.32,-h*.3,w*.64,h*.6);c.fillStyle='#7b67832a';c.fillRect(-w/2+7,-h/2+4,w-14,1.5);
let neon=seed>.52?'#c381ba':'#6cb8c6';for(let side of [-1,1]){c.fillStyle=neon+'65';c.fillRect(side*(w/2-5)-.5,-h*.27,1.4,h*.54);for(let i=0;i<4;i++){c.fillStyle=neon+(i%3?'45':'85');c.fillRect(-w*.3+i*w*.2,side*(h/2-5),w*.07,1.5)}}sceneryGlow(c,w*.25,-h*.45,35,neon,.14);
if(seed>.7){c.fillStyle='#1e2434';c.beginPath();c.ellipse(-w*.1,0,13,10,0,0,TAU);c.fill();let d=c.createLinearGradient(-10,-10,10,10);d.addColorStop(0,'#586174');d.addColorStop(1,'#1a2332');c.fillStyle=d;c.beginPath();c.ellipse(-w*.1,-3,10,8,0,0,TAU);c.fill()}else{for(let i=0;i<2;i++){c.fillStyle='#2d3042';c.fillRect(-w*.25+i*19,-9,13,15);c.fillStyle='#66708435';c.fillRect(-w*.25+i*19,-9,13,2)}}c.restore()}
function paintSceneryFeatures(c,id,tx,ty){let size=paintedScenery.size,colors=environmentPalettes[id]||environmentPalettes.grid;
// Multiple broad colour fields, subtle grain and surface shading replace outlines.
for(let i=0;i<5;i++){let q=cityHash(tx,ty,i+200);sceneryGlow(c,q*size,cityHash(tx,ty,i+300)*size,180+q*120,colors[i%2],.035+q*.025)}
if(id==='city'){// Wide roads recede beneath shaded roofs; no wireframe building borders.
c.fillStyle='#101929';for(let y=0;y<=size;y+=160)c.fillRect(0,y,size,18);for(let x=0;x<=size;x+=160)c.fillRect(x,0,18,size);for(let gy=0;gy<4;gy++)for(let gx=0;gx<4;gx++){let seed=cityHash(tx*4+gx,ty*4+gy,222);sceneryCityBlock(c,gx*160+88,gy*160+88,seed)}
}else if(id==='belt'||id==='cryo'){for(let i=0;i<7;i++){let seed=cityHash(tx,ty,i+19),x=65+(i%3)*215+seed*45,y=60+Math.floor(i/3)*220+seed*50;sceneryRock(c,x,y,(id==='cryo'?115:65)+seed*(id==='cryo'?65:55),seed,id==='cryo')}}
else if(id==='foundry'){for(let i=0;i<4;i++){let seed=cityHash(tx,ty,i+28);sceneryPlatform(c,160+(i%2)*320,160+Math.floor(i/2)*320,150+seed*85,115+seed*100,seed,true)}c.strokeStyle='#59404b55';c.lineWidth=11;for(let y of [14,626]){c.beginPath();c.moveTo(0,y);c.bezierCurveTo(160,y+10,450,y-10,640,y);c.stroke();c.strokeStyle='#79505825';c.lineWidth=2;c.stroke()}}
else if(id==='storm'){for(let i=0;i<2;i++){let seed=cityHash(tx,ty,i+39),x=165+i*310,y=160+seed*300;c.save();c.translate(x,y);let g=c.createRadialGradient(-15,-20,4,0,0,80);g.addColorStop(0,'#414261');g.addColorStop(.55,'#21263b');g.addColorStop(1,'#0a1020');c.fillStyle=g;c.beginPath();c.ellipse(0,0,75,75,0,0,TAU);c.fill();for(let j=0;j<3;j++){c.save();c.rotate(j*TAU/3+seed);sceneryPlatform(c,85,0,105,29,0,false);c.restore()}sceneryGlow(c,0,0,80,'#9672d6',.12);c.fillStyle='#a7b6df55';c.beginPath();c.ellipse(0,0,9,9,0,0,TAU);c.fill();c.restore()}}
else{// Sparse orbital hardware, muted navigation grid and broad teal illumination.
c.strokeStyle='#32686613';c.lineWidth=.7;for(let k=0;k<size;k+=80){c.beginPath();c.moveTo(k,0);c.lineTo(k,size);c.moveTo(0,k);c.lineTo(size,k);c.stroke()}let seed=cityHash(tx,ty,55);if(seed>.25)sceneryPlatform(c,320,320,170+seed*80,70+seed*90,seed,false)}
// Fixed per-tile film grain, deliberately below pickup and threat brightness.
for(let i=0;i<240;i++){let v=cityHash(tx*13+i,ty,408);c.fillStyle=i%2?'#a6b4ce05':'#00040c12';c.fillRect(v*size,cityHash(ty*7+i,tx,409)*size,1,1)}}
function paintSceneryTile(c,id,tx,ty){let size=paintedScenery.size;c.fillStyle={grid:'#081220',belt:'#100f19',storm:'#0e1023',foundry:'#140f1b',cryo:'#0a1724',city:'#0a1020'}[id]||'#081220';c.fillRect(0,0,size,size);
// Neighbouring world cells paint the same overhanging surfaces on both sides of every join.
for(let x=tx-1;x<=tx+1;x++)for(let y=ty-1;y<=ty+1;y++){c.save();c.translate((x-tx)*size,(y-ty)*size);paintSceneryFeatures(c,id,x,y);c.restore()}}
function paintedSceneryTile(id,tx,ty){let key=id+':'+tx+':'+ty,cache=paintedScenery.tiles;if(cache.has(key)){let tile=cache.get(key);cache.delete(key);cache.set(key,tile);return tile}if(typeof document.createElement!=='function')return null;let tile=document.createElement('canvas');tile.width=tile.height=paintedScenery.size;let c=tile.getContext('2d');if(!c)return null;paintSceneryTile(c,id,tx,ty);if(cache.size>=paintedScenery.limit)cache.delete(cache.keys().next().value);cache.set(key,tile);return tile}
function drawPaintedSectorArena(id,px,py,t){let size=paintedScenery.size,clock=reducedMotion?0:t,detail=graphicsDetailed()&&!(graphics.preset==='auto'&&graphicsCrowd.active),factor=id==='city'?.55:.72,cx=px*factor,cy=py*factor;ctx.save();ctx.shadowBlur=0;ctx.translate(px-cx,py-cy);ctx.fillStyle='#091220';ctx.fillRect(cx-W/2,cy-H/2,W,H);let minX=Math.floor((cx-W/2)/size),maxX=Math.floor((cx+W/2)/size),minY=Math.floor((cy-H/2)/size),maxY=Math.floor((cy+H/2)/size);for(let x=minX;x<=maxX;x++)for(let y=minY;y<=maxY;y++){let tile=paintedSceneryTile(id,x,y);if(tile)ctx.drawImage(tile,x*size,y*size)}
if(id==='city'){let n=0;for(let x=Math.floor((cx-W/2)/160);x<=Math.ceil((cx+W/2)/160);x++)for(let y=Math.floor((cy-H/2)/160);y<=Math.ceil((cy+H/2)/160);y++){if(n++>=100)break;let seed=cityHash(x,y,91),phase=(clock*(18+seed*13)+seed*160)%160;drawCityTraffic(x*160+phase,y*160+7,0,0,detail?30:17,detail);if(detail)drawCityTraffic(x*160+12,y*160+160-phase,-Math.PI/2,1,24,detail)}}ctx.restore();
// Soft atmospheric wisps are below all ships, pickups, physical terrain and warnings.
let mist=environmentMist(id);if(mist){for(let i=0;i<(detail?3:1);i++){let span=W+900,x=px-W/2-450+((i*431+clock*(id==='foundry'?6:3)-px*.12)%span+span)%span,y=py-H/2+H*(.12+i*.34);ctx.save();ctx.globalAlpha=id==='cryo'?.85:id==='storm'?.8:.6;ctx.drawImage(mist,x,y-145,900,290);ctx.restore()}}
if(detail){ctx.save();ctx.fillStyle=environmentPalettes[id][0];for(let i=0;i<16;i++){let x=px-W/2+((i*193.7-px*.17+clock*.7)%W+W)%W,y=py-H/2+((i*137.3-py*.17-clock*(id==='foundry'?6:1))%H+H)%H;ctx.globalAlpha=.12;ctx.beginPath();ctx.arc(x,y,i%4===0?1.1:.6,0,TAU);ctx.fill()}ctx.restore()}}
function drawArena(px,py,t){drawPaintedSectorArena('grid',px,py,t)}
function drawSectorArena(px,py,t){drawPaintedSectorArena(s.sector,px,py,t)}
function drawCityArena(px,py,t){let clock=reducedMotion?0:t,cx=px*.55,cy=py*.55,detail=graphicsDetailed()&&!(graphics.preset==='auto'&&graphicsCrowd.active);ctx.save();ctx.translate(px-cx,py-cy);ctx.shadowBlur=0;ctx.fillStyle='#0a1020';ctx.fillRect(cx-W/2-2,cy-H/2-2,W+4,H+4);
 let left=Math.floor((cx-W/2)/320),right=Math.floor((cx+W/2)/320),top=Math.floor((cy-H/2)/320),bottom=Math.floor((cy+H/2)/320);for(let x=left;x<=right;x++)for(let y=top;y<=bottom;y++){let tile=cityTile(x,y);if(tile)ctx.drawImage(tile,x*320,y*320);else{ctx.save();ctx.translate(x*320,y*320);paintCityTile(ctx,x,y);ctx.restore()}}
 // Analytic road traffic: no particle arrays or simulation objects; fixed per visible lane budget.
 let minX=Math.floor((cx-W/2)/160),maxX=Math.ceil((cx+W/2)/160),minY=Math.floor((cy-H/2)/160),maxY=Math.ceil((cy+H/2)/160);ctx.lineCap='round';let count=0;for(let x=minX;x<=maxX;x++)for(let y=minY;y<=maxY;y++){if(count++>=100)break;let seed=cityHash(x,y,91),phase=((clock*(18+seed*13)+seed*160)%160+160)%160;for(let lane=0;lane<(detail?2:1);lane++){let p=lane?160-phase:phase,len=detail?17+seed*23:12,angle=lane?Math.PI:0;drawCityTraffic(x*160+p,y*160+4+lane*7,angle,lane,len,detail);drawCityTraffic(x*160+4+lane*7,y*160+p,angle+Math.PI/2,lane,len,detail)}}

 // Sparse rail route, moving train windows; reduced motion freezes the exact same scene.
 ctx.globalAlpha=.35;ctx.strokeStyle='#4f426a';ctx.lineWidth=1;for(let y=Math.floor((cy-H/2)/800);y<=Math.ceil((cy+H/2)/800);y++){let yy=y*800+135;ctx.beginPath();ctx.moveTo(cx-W/2,yy);ctx.lineTo(cx+W/2,yy);ctx.stroke();let period=W+140,x=cx-W/2+((clock*31+y*173)%period+period)%period-60;for(let j=0;j<3;j++){ctx.fillStyle='#34283e';ctx.fillRect(x-j*16,yy-3,14,6);ctx.fillStyle='#8dbbbd';ctx.fillRect(x-j*16+2,yy-1,3,2);ctx.fillRect(x-j*16+7,yy-1,3,2)}}ctx.globalAlpha=1;ctx.restore();
 // Clouds are a foreground-of-city layer only, drawn before ALL gameplay objects.
 let cloud=cityCloud();if(cloud){let n=detail?4:2;for(let i=0;i<n;i++){let span=W+750,x=px-W/2-375+((i*431+clock*7-px*.12)%span+span)%span,y=py-H/2+((i*.29+.12)%1)*H;ctx.save();ctx.translate(x,y);ctx.rotate(-.24);ctx.globalAlpha=detail?.8:.5;ctx.drawImage(cloud,-W*.3,-42,W*.8,84);ctx.restore()}}
}
function paintCityTile(c,tx,ty){c.fillStyle='#0a1020';c.fillRect(0,0,320,320);c.lineWidth=.65;for(let sy=0;sy<2;sy++)for(let sx=0;sx<2;sx++){let gx=tx*2+sx,gy=ty*2+sy,ox=sx*160,oy=sy*160;c.save();c.translate(ox,oy);c.fillStyle='#111b2a';c.fillRect(0,0,160,15);c.fillRect(0,0,15,160);c.strokeStyle='#293346';c.strokeRect(15,15,145,145);c.fillStyle='#3a4356';for(let j=26;j<160;j+=30){c.fillRect(j,7,11,.65);c.fillRect(7,j,.65,11)}
 for(let k=0;k<9;k++){let v=cityHash(gx,gy,k),u=cityHash(gx+31,gy-12,k),x=23+k%3*43+u*4,y=23+Math.floor(k/3)*43+v*4,w=17+u*21,h=17+v*20,col=v>.5?'#44344f':'#2d4257',neon=u>.52?'#dc83ce':'#75cbd9';c.fillStyle='#070c17';c.fillRect(x+2,y+3,w,h);c.fillStyle=v>.5?'#191b30':'#182537';c.strokeStyle=col;
 if(v>.82){c.beginPath();c.moveTo(x,y);c.lineTo(x+w,y);c.lineTo(x+w,y+h*.4);c.lineTo(x+w*.55,y+h*.4);c.lineTo(x+w*.55,y+h);c.lineTo(x,y+h);c.closePath();c.fill();c.stroke()}else if(v<.12){c.beginPath();c.arc(x+w/2,y+h/2,Math.min(w,h)/2,0,Math.PI*2);c.fill();c.stroke()}else{c.fillRect(x,y,w,h);c.strokeRect(x,y,w,h)}
 if(u>.32){c.strokeStyle=neon;c.beginPath();c.moveTo(x+2,y+h);c.lineTo(x+w*.7,y+h);c.stroke()}c.fillStyle=neon;c.globalAlpha=.6;for(let j=0;j<2+(k%2);j++)c.fillRect(x+4+j*4,y+4,1.5,1.5);c.globalAlpha=1;if(u>.72){c.fillStyle='#874d89';c.fillRect(x+4,y+h-7,Math.min(12,w-8),3)}
 }
