 let grid=belt?80:64,minX=Math.floor((px-W/2)/grid)-1,maxX=Math.ceil((px+W/2)/grid)+1,minY=Math.floor((py-H/2)/grid)-1,maxY=Math.ceil((py+H/2)/grid)+1;ctx.lineWidth=1;ctx.strokeStyle=belt?'#65462c44':'#584d8b66';ctx.beginPath();for(let x=minX;x<=maxX;x++)for(let y=minY;y<=maxY;y++){let seed=Math.abs(Math.sin(x*73.13+y*137.91)*1247.2)%1,xx=x*grid,yy=y*grid;if(belt){if(seed>.25){ctx.moveTo(xx+8,yy);ctx.lineTo(xx+grid*(.4+seed*.5),yy)}if(seed>.5){ctx.moveTo(xx,yy+9);ctx.lineTo(xx,yy+grid*.8)}}else{ctx.moveTo(xx,yy);ctx.lineTo(xx+grid*.65,yy);ctx.lineTo(xx+grid,yy+grid*.35);ctx.lineTo(xx+grid,yy+grid);if(seed>.75){let p=(clock*25+seed*grid)%grid;ctx.save();ctx.fillStyle='#c3a2ff';ctx.globalAlpha=.35;ctx.fillRect(xx+p,yy-1,6,2);ctx.restore()}}}ctx.stroke();
 // World-anchored background structures, dim enough to distinguish from physical salvage.
 let size=420;for(let x=Math.floor((px-W/2-170)/size);x<=Math.ceil((px+W/2+170)/size);x++)for(let y=Math.floor((py-H/2-170)/size);y<=Math.ceil((py+H/2+170)/size);y++){let seed=Math.abs(Math.sin(x*31.7+y*67.3)*923)%1,xx=x*size+seed*150,yy=y*size+seed*100;ctx.save();ctx.translate(xx,yy);ctx.rotate(seed*TAU);ctx.globalAlpha=belt?.38:.42;if(belt){ctx.fillStyle='#322b31';poly([[-95,-18],[-14,-18],[5,-7],[22,-25],[80,-18],[104,6],[28,17],[8,2],[-18,16],[-102,13]],'#302930','#74604b',1);for(let side of [-1,1]){poly([[-55,side*22],[-10,side*28],[-20,side*63],[-65,side*56]],'#252530','#665647',1);ctx.fillStyle='#ad7b4e';ctx.fillRect(-58,side*36,30,2)}ctx.lineWidth=2;ctx.strokeStyle='#a76b3d';ctx.beginPath();ctx.moveTo(-7,-13);ctx.lineTo(-19,2);ctx.lineTo(-6,14);ctx.stroke()}else{for(let i=0;i<4;i++){ctx.save();ctx.rotate(i*TAU/4);poly([[13,-7],[49,-7],[67,-24],[76,-15],[57,6],[13,8]],'#25203c','#77679c',1);ctx.fillStyle='#8a68a8';ctx.fillRect(24,-2,27,2);ctx.restore()}hex(24,'#211d36','#8b79bd',2);circle(0,0,10,'#3a285e','#c09aee',1);ctx.globalAlpha=reducedMotion?.35:.3+.2*Math.sin(clock*2+seed*10);circle(0,0,6,'#ba9aef');ctx.strokeStyle='#8b6fcf44';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,60,clock*.2,clock*.2+1.8);ctx.stroke()}ctx.restore()}

 for(let k=0;k<9;k++){let v=cityHash(gx,gy,k),u=cityHash(gx+31,gy-12,k),x=23+k%3*43+u*4,y=23+Math.floor(k/3)*43+v*4,w=17+u*21,h=17+v*20,col=v>.5?'#44344f':'#2d4257',neon=u>.52?'#dc83ce':'#75cbd9';c.fillStyle='#070c17';c.fillRect(x+2,y+3,w,h);c.fillStyle=v>.5?'#191b30':'#182537';c.strokeStyle=col;
