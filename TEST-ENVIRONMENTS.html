<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sector texture continuity</title><style>body{background:#080d1a;color:#dce8fa;font:16px Arial;margin:24px}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}canvas{width:100%;height:auto}h2{font-size:18px}@media(max-width:700px){main{grid-template-columns:1fr}}</style><h1>Six continuous sector textures</h1><p>Actual scenery renderer. Scroll through seams in both axes. This is a development review, not a captured run.</p><label>Camera travel <input id="scroll" type="range" min="-15000" max="15000" value="3800" style="width:50%"></label><label><input id="freeze" type="checkbox">Reduced motion</label><main><article><h2>Neon Expanse</h2><canvas width="640" height="380" data-id="grid"></canvas></article><article><h2>Shattered Belt</h2><canvas width="640" height="380" data-id="belt"></canvas></article><article><h2>Storm Relay</h2><canvas width="640" height="380" data-id="storm"></canvas></article><article><h2>Cinder Foundry</h2><canvas width="640" height="380" data-id="foundry"></canvas></article><article><h2>Cryo Reach</h2><canvas width="640" height="380" data-id="cryo"></canvas></article><article><h2>Neon Undercity</h2><canvas width="640" height="380" data-id="city"></canvas></article></main><script>let ctx,W=640,H=380,reducedMotion=false,TAU=Math.PI*2,graphics={preset:'high'},graphicsCrowd={active:false};const sectorTextureSources={"grid":"sector-background-grid-v0400.jpg","belt":"sector-background-belt-v0400.jpg","storm":"sector-background-storm-v0400.jpg","foundry":"sector-background-foundry-v0400.jpg","cryo":"sector-background-cryo-v0400.jpg","city":"sector-background-city-v0400.jpg"},sectorTextureCache=new Map();function graphicsDetailed(){return true}function drawPaintedSectorArena(){ctx.fillStyle='#080d1a';ctx.fillRect(-10000,-10000,20000,20000)}function drawCityTraffic(){};function sectorTexture(id){let row=sectorTextureCache.get(id);if(row){sectorTextureCache.delete(id);sectorTextureCache.set(id,row);return row}if(typeof Image!=='function'||!sectorTextureSources[id])return null;row={image:new Image,tiles:new Map};sectorTextureCache.set(id,row);row.image.src=sectorTextureSources[id];while(sectorTextureCache.size>6){let key=sectorTextureCache.keys().next().value;sectorTextureCache.delete(key)}return row}
function seamlessSectorTile(image,limit){if(!image.complete||!image.naturalWidth||!image.naturalHeight||!document.createElement)return null;
 let size=Math.min(limit,image.naturalWidth,image.naturalHeight),overlap=Math.round(size*.18),period=size-overlap,layer=document.createElement('canvas');layer.width=layer.height=size;let g=layer.getContext('2d');if(!g)return null;g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(image,0,0,size,size);
 // Smooth, complementary weights merge opposite edges in both axes, without reflection.
 function feather(vertical){let fade=g.createLinearGradient(0,0,vertical?0:size,vertical?size:0);for(let i=0;i<=16;i++){let q=i/16,w=q*q*(3-2*q);fade.addColorStop(q*overlap/size,'rgba(255,255,255,'+w+')')}fade.addColorStop(period/size,'#fff');for(let i=1;i<=16;i++){let q=i/16,w=1-q*q*(3-2*q);fade.addColorStop((period+q*overlap)/size,'rgba(255,255,255,'+w+')')}g.globalCompositeOperation='destination-in';g.fillStyle=fade;g.fillRect(0,0,size,size)}feather(false);feather(true);
 let tile=document.createElement('canvas');tile.width=tile.height=period;let out=tile.getContext('2d');if(!out)return null;out.globalCompositeOperation='lighter';for(let x of [0,-period])for(let y of [0,-period])out.drawImage(layer,x,y);out.globalCompositeOperation='destination-over';out.fillStyle='#080d1a';out.fillRect(0,0,period,period);out.globalCompositeOperation='source-over';return tile}
function sectorTextureSurface(id){let row=sectorTexture(id);if(!row||!row.image.complete||!row.image.naturalWidth)return null;let limit=graphics.preset==='low'?768:Math.min(2048,row.image.naturalWidth),key=String(limit);if(row.tiles.has(key))return row.tiles.get(key);let tile=seamlessSectorTile(row.image,limit);if(!tile)return null;let pattern=ctx.createPattern(tile,'repeat');if(!pattern)return null;let surface={tile,pattern,span:Math.min(1536,Math.round(row.image.naturalWidth*.82))};row.tiles.set(key,surface);while(row.tiles.size>1)row.tiles.delete(row.tiles.keys().next().value);return surface}
function drawTexturedSectorArena(id,px,py,t){let surface=sectorTextureSurface(id);if(!surface){drawPaintedSectorArena(id,px,py,t);return}let clock=reducedMotion?0:t,detail=graphicsDetailed()&&!(graphics.preset==='auto'&&graphicsCrowd.active),span=surface.span,cx=px*.27+(reducedMotion?0:Math.sin(clock*.018)*23),cy=py*.27+(reducedMotion?0:Math.cos(clock*.014)*17),scale=span/surface.tile.width;
 ctx.save();ctx.shadowBlur=0;ctx.translate(px-cx,py-cy);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.save();ctx.scale(scale,scale);ctx.fillStyle=surface.pattern;ctx.fillRect((cx-W/2)/scale,(cy-H/2)/scale,W/scale,H/scale);ctx.restore();
 // A single repeating pattern avoids subpixel cracks between separately drawn image rectangles.
 ctx.fillStyle='#040a1438';ctx.fillRect(cx-W/2,cy-H/2,W,H);ctx.restore();
 if(detail){ctx.save();for(let i=0;i<24;i++){let x=px-W/2+((i*193.7-px*.12+clock*.3)%W+W)%W,y=py-H/2+((i*137.3-py*.12-clock*(id==='foundry'?4:.4))%H+H)%H;ctx.globalAlpha=i%5===0?.32:.15;ctx.fillStyle=id==='foundry'?'#eb9868':id==='cryo'?'#8fd6e4':'#afadcb';ctx.beginPath();ctx.arc(x,y,i%5===0?1:.55,0,TAU);ctx.fill()}ctx.restore()}
 if(id==='city'){ctx.save();ctx.globalAlpha=.45;for(let i=0;i<(detail?12:5);i++){let q=((clock*.008+i*.0833)%1+1)%1,a=q*Math.PI,x=px+(q-.5)*span*.8-px*.08,y=py+Math.sin(a)*span*.13+(i%2?.18:-.17)*span-py*.08;drawCityTraffic(x,y,i%2?.25:-.3,i%2,detail?12:7,detail)}ctx.restore()}}
function render(t){let scroll=Number(document.getElementById('scroll').value);reducedMotion=document.getElementById('freeze').checked;for(let canvas of document.querySelectorAll('canvas')){ctx=canvas.getContext('2d');ctx.save();ctx.translate(320-scroll,190-scroll*.4);drawTexturedSectorArena(canvas.dataset.id,scroll,scroll*.4,t/1000);ctx.restore()}requestAnimationFrame(render)}requestAnimationFrame(render);</script>
