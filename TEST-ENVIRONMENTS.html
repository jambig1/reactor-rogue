<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sector texture continuity</title><style>body{background:#080d1a;color:#dce8fa;font:16px Arial;margin:24px}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}canvas{width:100%;height:auto}h2{font-size:18px}@media(max-width:700px){main{grid-template-columns:1fr}}</style><h1>Six continuous sector textures</h1><p>Actual scenery renderer. Scroll through seams in both axes. This is a development review, not a captured run.</p><label>Camera travel <input id="scroll" type="range" min="-15000" max="15000" value="3800" style="width:50%"></label><label><input id="freeze" type="checkbox">Reduced motion</label><main><article><h2>Neon Expanse</h2><canvas width="640" height="380" data-id="grid"></canvas></article><article><h2>Shattered Belt</h2><canvas width="640" height="380" data-id="belt"></canvas></article><article><h2>Storm Relay</h2><canvas width="640" height="380" data-id="storm"></canvas></article><article><h2>Cinder Foundry</h2><canvas width="640" height="380" data-id="foundry"></canvas></article><article><h2>Cryo Reach</h2><canvas width="640" height="380" data-id="cryo"></canvas></article><article><h2>Neon Undercity</h2><canvas width="640" height="380" data-id="city"></canvas></article></main><script>let ctx,W=640,H=380,reducedMotion=false,TAU=Math.PI*2,graphics={preset:'high'},graphicsCrowd={active:false},graphicsVisual={particles:'full'};function circle(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=c;ctx.fill()}const sectorTextureSources={"grid":"sector-background-grid-v0400.jpg","belt":"sector-background-belt-v0400.jpg","storm":"sector-background-storm-v0400.jpg","foundry":"sector-background-foundry-v0400.jpg","cryo":"sector-background-cryo-v0400.jpg","city":"sector-background-city-v0400.jpg"},sectorTextureCache=new Map();function graphicsDetailed(){return true}function drawPaintedSectorArena(){ctx.fillStyle='#080d1a';ctx.fillRect(-10000,-10000,20000,20000)}function drawCityTraffic(){};function sectorTexture(id){let row=sectorTextureCache.get(id);if(row){sectorTextureCache.delete(id);sectorTextureCache.set(id,row);return row}if(typeof Image!=='function'||!sectorTextureSources[id])return null;row={image:new Image,tiles:new Map};sectorTextureCache.set(id,row);row.image.src=sectorTextureSources[id];while(sectorTextureCache.size>6){let key=sectorTextureCache.keys().next().value;sectorTextureCache.delete(key)}return row}
function seamlessSectorTile(image,limit){if(!image.complete||!image.naturalWidth||!image.naturalHeight||!document.createElement)return null;
 let size=Math.min(limit,image.naturalWidth,image.naturalHeight),overlap=Math.round(size*.18),period=size-overlap,layer=document.createElement('canvas');layer.width=layer.height=size;let g=layer.getContext('2d');if(!g)return null;g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(image,0,0,size,size);
 // Smooth, complementary weights merge opposite edges in both axes, without reflection.
 function feather(vertical){let fade=g.createLinearGradient(0,0,vertical?0:size,vertical?size:0);for(let i=0;i<=16;i++){let q=i/16,w=q*q*(3-2*q);fade.addColorStop(q*overlap/size,'rgba(255,255,255,'+w+')')}fade.addColorStop(period/size,'#fff');for(let i=1;i<=16;i++){let q=i/16,w=1-q*q*(3-2*q);fade.addColorStop((period+q*overlap)/size,'rgba(255,255,255,'+w+')')}g.globalCompositeOperation='destination-in';g.fillStyle=fade;g.fillRect(0,0,size,size)}feather(false);feather(true);
 let tile=document.createElement('canvas');tile.width=tile.height=period;let out=tile.getContext('2d');if(!out)return null;out.globalCompositeOperation='lighter';for(let x of [0,-period])for(let y of [0,-period])out.drawImage(layer,x,y);out.globalCompositeOperation='destination-over';out.fillStyle='#080d1a';out.fillRect(0,0,period,period);out.globalCompositeOperation='source-over';return tile}
function sectorMaterialSurface(tile){let g=tile.getContext('2d');if(!g||!g.getImageData||!g.putImageData)return tile;let pixels;try{pixels=g.getImageData(0,0,tile.width,tile.height)}catch(e){return tile}if(!pixels?.data)return tile;let data=pixels.data,n=tile.width,bayer=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];for(let y=0;y<tile.height;y++)for(let x=0;x<n;x++){let i=(y*n+x)*4,dither=(bayer[(Math.floor(y/2)%4)*4+Math.floor(x/2)%4]-7.5)*.38,grit=(cityHash(Math.floor(x/2),Math.floor(y/2),113)-.5)*3;for(let k=0;k<3;k++){let c=data[i+k],q=Math.round((c+dither)/14)*14;data[i+k]=clamp(Math.round(c*.42+q*.58+grit),0,255)}}g.putImageData(pixels,0,0);return tile}
function sectorSceneryLights(tile,id){let g=tile.getContext('2d');if(!g?.getImageData)return [];let pixels;try{pixels=g.getImageData(0,0,tile.width,tile.height)}catch(e){return []}if(!pixels?.data)return [];let rows=[],n=tile.width,data=pixels.data;for(let y=12;y<tile.height-12;y+=28)for(let x=12;x<n-12;x+=28){if(cityHash(x,y,51)<.86)continue;let best=null,score=0;for(let dy=-8;dy<=8;dy+=4)for(let dx=-8;dx<=8;dx+=4){let i=((y+dy)*n+x+dx)*4,r=data[i],g=data[i+1],b=data[i+2],light=id==='foundry'?r*.8+g*.2:id==='city'?g*.55+b*.45:(r+g+b)/3;if(light>score){score=light;best={x:x+dx,y:y+dy,phase:cityHash(x,y,93)*TAU}}}if(score>35&&best)rows.push(best)}return rows.sort((a,b)=>cityHash(a.x,a.y,191)-cityHash(b.x,b.y,191)).slice(0,48)}
function sectorTextureSurface(id){let row=sectorTexture(id);if(!row||!row.image.complete||!row.image.naturalWidth)return null;let limit=graphics.preset==='low'?768:Math.min(2048,row.image.naturalWidth),key=String(limit);if(row.tiles.has(key))return row.tiles.get(key);let tile=seamlessSectorTile(row.image,limit);if(!tile)return null;sectorMaterialSurface(tile);let pattern=ctx.createPattern(tile,'repeat');if(!pattern)return null;let surface={tile,pattern,span:Math.min(1536,Math.round(row.image.naturalWidth*.82)),lights:sectorSceneryLights(tile,id)};row.tiles.set(key,surface);while(row.tiles.size>1)row.tiles.delete(row.tiles.keys().next().value);return surface}
function drawSectorAmbience(id,px,py,t,surface,cx,cy){let clock=reducedMotion?0:t,crowded=graphics.preset==='auto'&&graphicsCrowd.active,low=graphics.preset==='low'||crowded,lights=surface.lights||[],span=surface.span,colors={grid:'#7cbbb9',belt:'#bca17d',storm:'#ac99d4',foundry:'#e6a16a',cryo:'#9ac8d7',city:'#99b7cf'},c=colors[id]||colors.grid;
 ctx.save();ctx.shadowBlur=0;ctx.translate(px-cx,py-cy);let left=Math.floor((cx-W/2)/span),right=Math.floor((cx+W/2)/span),top=Math.floor((cy-H/2)/span),bottom=Math.floor((cy+H/2)/span),budget=low?18:64,count=0,perTile=Math.max(3,Math.floor(budget/((right-left+1)*(bottom-top+1))));ctx.lineCap='round';
 for(let x=left;x<=right&&count<budget;x++)for(let y=top;y<=bottom&&count<budget;y++){let tileCount=0;for(let point of lights){if(count>=budget||tileCount>=perTile)break;let xx=x*span+point.x/surface.tile.width*span,yy=y*span+point.y/surface.tile.height*span;if(xx<cx-W/2-8||xx>cx+W/2+8||yy<cy-H/2-8||yy>cy+H/2+8)continue;count++;tileCount++;let pulse=.5+.5*Math.sin(clock*(id==='city'?1.8:id==='storm'?2.2:.9)+point.phase);ctx.globalAlpha=(low?.15:.22)+pulse*(low?.23:.35);ctx.fillStyle=c;ctx.fillRect(Math.round(xx)-1,Math.round(yy),id==='city'?3:2,1);if(!low){ctx.globalAlpha=.05+pulse*.09;circle(xx,yy,4+pulse*2,c)}}}ctx.restore();
 // Slow dust, embers and snow remain separate from the bright gameplay layer.
 let particles=graphicsVisual.particles!=='off',n=particles?(low?12:32):0;ctx.save();ctx.fillStyle=c;ctx.strokeStyle=c;ctx.lineWidth=.7;for(let i=0;i<n;i++){let seed=cityHash(i,7,39),speed=id==='foundry'?12+seed*13:id==='cryo'?5+seed*5:2+seed*5,xx=px-W/2+((i*193.7-px*.09+clock*(id==='cryo'?4:1+seed*3))%W+W)%W,yy=py-H/2+((i*137.3-py*.09+clock*(id==='foundry'?-speed:speed))%H+H)%H;ctx.globalAlpha=.15+seed*.22;ctx.fillRect(Math.round(xx),Math.round(yy),i%7===0?2:1,i%7===0?2:1);if(id==='foundry'||id==='cryo'){ctx.globalAlpha*=.5;ctx.beginPath();ctx.moveTo(xx,yy);ctx.lineTo(xx-(id==='cryo'?3:0),yy+(id==='foundry'?4:-2));ctx.stroke()}if(id==='storm'&&i%9===0){ctx.globalAlpha=.07+.06*Math.sin(clock+seed*TAU);ctx.beginPath();ctx.moveTo(xx-12,yy+2);ctx.quadraticCurveTo(xx,yy-8,xx+15,yy+3);ctx.stroke()}}ctx.restore()
}
function drawTexturedSectorArena(id,px,py,t){let surface=sectorTextureSurface(id);if(!surface){drawPaintedSectorArena(id,px,py,t);return}let clock=reducedMotion?0:t,detail=graphicsDetailed()&&!(graphics.preset==='auto'&&graphicsCrowd.active),span=surface.span,cx=px*.27+(reducedMotion?0:Math.sin(clock*.018)*23),cy=py*.27+(reducedMotion?0:Math.cos(clock*.014)*17),scale=span/surface.tile.width;
 ctx.save();ctx.shadowBlur=0;ctx.translate(px-cx,py-cy);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.save();ctx.scale(scale,scale);ctx.fillStyle=surface.pattern;ctx.fillRect((cx-W/2)/scale,(cy-H/2)/scale,W/scale,H/scale);ctx.restore();
 // A single repeating pattern avoids subpixel cracks between separately drawn image rectangles.
 ctx.fillStyle='#040a1438';ctx.fillRect(cx-W/2,cy-H/2,W,H);ctx.restore();
 drawSectorAmbience(id,px,py,t,surface,cx,cy)}
function cityHash(x,y,n=0){let h=(Math.imul(x|0,73856093)^Math.imul(y|0,19349663)^Math.imul(n+17,83492791))>>>0;h=Math.imul(h^(h>>>16),0x7feb352d);h=Math.imul(h^(h>>>15),0x846ca68b);return ((h^(h>>>16))>>>0)/4294967296}
function render(t){let scroll=Number(document.getElementById('scroll').value);reducedMotion=document.getElementById('freeze').checked;for(let canvas of document.querySelectorAll('canvas')){ctx=canvas.getContext('2d');ctx.save();ctx.translate(320-scroll,190-scroll*.4);drawTexturedSectorArena(canvas.dataset.id,scroll,scroll*.4,t/1000);ctx.restore()}requestAnimationFrame(render)}requestAnimationFrame(render);</script>
