<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reactor Rogue — beam visual checks v0.15.1</title><style>*{box-sizing:border-box}body{margin:0;background:#080f20;color:#e5edf9;font:14px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}header{border-bottom:1px solid #61527d;padding-bottom:18px;margin-bottom:20px}h1{font-size:28px;margin:8px 0;color:#d9bcff}small,p{color:#aab7d0}nav{display:flex;gap:20px;align-items:center;flex-wrap:wrap}select{padding:8px;background:#29213c;color:#eff;border:1px solid #9e7db8}article{background:linear-gradient(130deg,#1b2940,#241d39);border:1px solid #65517f;border-radius:12px;margin:16px 0;padding:16px}h2{margin:0;font-size:18px}article p{font-size:12px;margin:6px 0}canvas{display:block;width:100%;height:auto}label{font-size:13px}</style><main><header><small>REACTOR ROGUE / v0.15.1 VISUAL CHECK</small><h1>Overcharged beam weapons</h1><p>Production beam renderer in an isolated visual loop. This page does not simulate combat or use your save.</p><nav><label>Effect quality <select id="quality"><option>Medium</option><option>High</option><option>Low</option></select></label><label><input type="checkbox" id="motion"> Reduced motion</label></nav></header><div id="samples"></div></main><script>
const styles=[['laser','Pulse Laser','#ff79c6',22,'Hot core, layered pink energy and compact hit flares.'],['rail','Rail Lance','#b5e7ff',10,'A tight blue-white lance with travelling chevrons.'],['sails','Solar Sails','#ffe8a1',18,'Gold ribbons with diagonal energy bands.'],['leech','Leech Beam','#ff9fbd',7,'Braided siphon strands flow back towards the ship.'],['prism','Prism Refraction','#d2aaff',5,'Purple light with crystalline energy nodes.']];document.querySelector('#samples').innerHTML=styles.map(([id,name,color,width,desc])=>'<article><h2 style="color:'+color+'">'+name+'</h2><p>'+desc+'</p><canvas data-beam="'+id+'" width="1000" height="140" aria-label="'+name+' visual sample"></canvas></article>').join('');let ctx,graphics={preset:'medium'},graphicsCrowd={active:false},reducedMotion=false;const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),graphicsDetailed=()=>graphics.preset!=='low',graphicsParticles=()=>graphics.preset==='low'?0:1;function circle(x,y,r,c,fill=true){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx[fill?'fillStyle':'strokeStyle']=c;fill?ctx.fill():ctx.stroke()}function poly(points,fill,stroke,width=1){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.lineWidth=width;ctx.strokeStyle=stroke;ctx.stroke()}}
// Decorative beam geometry: fixed stroke/node counts, no particles, RNG or combat writes.
let beamVisualCount=0;
function drawWeaponBeam(f,t,style=f.beamStyle,width=f.width||3,color=f.c){
 let dx=f.bx-f.x,dy=f.by-f.y,length=Math.hypot(dx,dy);if(!Number.isFinite(length)||length<.1)return;
 let fade=clamp(f.life/(f.max||f.life||1),0,1);if(fade<=0)return;
 let detailed=graphicsDetailed()&&!(graphics.preset==='auto'&&graphicsCrowd.active)&&beamVisualCount++<12,decor=detailed&&graphicsParticles()>0,clock=reducedMotion?0:t,age=(f.max||f.life||1)-f.life,w=Math.max(2,width),alpha=fade*(f.r!==undefined?.65:1);
 const solar=style==='sails',leech=style==='leech',rail=style==='rail',prism=style==='prism',tether=style==='harpoon',fence=style==='fence';
 let core=solar?'#fff7d2':leech?'#ffe4ec':rail?'#edfaff':prism?'#f7eaff':fence?'#d9fff7':'#fff1fc';
 ctx.save();ctx.translate(f.x,f.y);ctx.rotate(Math.atan2(dy,dx));ctx.shadowBlur=0;ctx.lineCap='round';ctx.lineJoin='round';
 const stroke=(weight,c,a)=>{ctx.globalAlpha=alpha*a;ctx.lineWidth=weight;ctx.strokeStyle=c;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(length,0);ctx.stroke()};
 if(detailed){
  let flare=ctx.createLinearGradient(0,0,length,0);flare.addColorStop(0,core);flare.addColorStop(.12,color);flare.addColorStop(.55,core);flare.addColorStop(.88,color);flare.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=flare;ctx.globalAlpha=alpha*.22;ctx.beginPath();ctx.moveTo(0,0);for(let i=1;i<=12;i++){let x=length*i/12,envelope=Math.sin(i*Math.PI/12),wave=rail?1:1+.15*Math.sin(i*1.7-clock*11);ctx.lineTo(x,-(w*.65+3)*envelope*wave)}for(let i=11;i>=0;i--){let x=length*i/12,envelope=Math.sin(i*Math.PI/12),wave=rail?1:1+.15*Math.cos(i*1.7-clock*11);ctx.lineTo(x,(w*.65+3)*envelope*wave)}ctx.closePath();ctx.fill();stroke(w,color,.3);stroke(Math.max(2,w*.55),flare,.85)
 }else stroke(w,color,.7);
 stroke(Math.max(1,Math.min(5,w*.2)),core,.95);
 if(decor){
  // Braided siphons run towards the pilot; solar/rail pulses travel outwards.
  if(leech||tether){ctx.globalAlpha=alpha*.7;ctx.strokeStyle=core;ctx.lineWidth=1;for(let side of [-1,1]){ctx.beginPath();for(let i=0;i<=16;i++){let x=length*i/16,y=Math.sin(i*.9+clock*(leech?13:8))*Math.min(5,w*.6)*side;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}}
  let nodes=rail?5:prism?3:solar?4:fence?5:3;for(let i=0;i<nodes;i++){let phase=(i/nodes+(reducedMotion?0:clock*(leech?-.75:.9)))%1;if(phase<0)phase+=1;let x=length*(.08+.84*phase),r=rail?4:prism?5:Math.min(4,w*.4+1);ctx.globalAlpha=alpha*.75;ctx.strokeStyle=core;ctx.fillStyle=core;ctx.lineWidth=1;
   if(rail){ctx.beginPath();ctx.moveTo(x-4,-w*.55-2);ctx.lineTo(x+4,0);ctx.lineTo(x-4,w*.55+2);ctx.stroke()}
   else if(prism){poly([[x-r,0],[x,-r],[x+r,0],[x,r]],'#bc8bff44',core,1)}
   else if(solar){ctx.beginPath();ctx.moveTo(x-4,-w*.6);ctx.lineTo(x+4,w*.6);ctx.stroke()}
   else circle(x,0,r,core)
  }
 }
 // Compact muzzle lens and terminal cap, without expensive long-line shadow blur.
 ctx.globalAlpha=alpha*.8;ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(0,0,Math.min(5,w*.4+2),Math.min(18,w*.65+3),0,0,TAU);ctx.stroke();
 ctx.globalAlpha=alpha;circle(0,0,Math.min(5,w*.2+1),core);ctx.lineWidth=2;ctx.strokeStyle=core;ctx.beginPath();if(detailed){ctx.moveTo(-8,-w*.55);ctx.lineTo(8,w*.55);ctx.moveTo(-8,w*.55);ctx.lineTo(8,-w*.55);ctx.moveTo(length-10,-Math.min(7,w*.3));ctx.lineTo(length,0);ctx.lineTo(length-10,Math.min(7,w*.3))}else{ctx.moveTo(length,-Math.min(10,w*.45+2));ctx.lineTo(length,Math.min(10,w*.45+2))}ctx.stroke();
 if(detailed)for(let point of f.beamHits||[]){let x=(point.x-f.x)*dx/length+(point.y-f.y)*dy/length;ctx.globalAlpha=alpha*.85;ctx.strokeStyle=core;ctx.lineWidth=1.5;let r=4+Math.min(7,w*.3)*(reducedMotion?.5:1-clamp(age/(f.max||1),0,1));ctx.beginPath();ctx.moveTo(x-r,0);ctx.lineTo(x+r,0);ctx.moveTo(x,-r);ctx.lineTo(x,r);ctx.moveTo(x-r*.7,-r*.7);ctx.lineTo(x+r*.7,r*.7);ctx.moveTo(x-r*.7,r*.7);ctx.lineTo(x+r*.7,-r*.7);ctx.stroke();ctx.globalAlpha=alpha*.45;circle(x,0,r+3,color,false)}
 ctx.restore();
}
function beamHitMark(visual,e){if(!visual||!visual.beamStyle)return;if(!visual.beamHits)visual.beamHits=[];if(visual.beamHits.length<4)visual.beamHits.push({x:e.x,y:e.y})}

let started=performance.now();function frame(now){graphics.preset=document.querySelector('#quality').value.toLowerCase();reducedMotion=document.querySelector('#motion').checked;let t=reducedMotion?0:(now-started)/1000;beamVisualCount=0;for(let [id,name,color,width] of styles){ctx=document.querySelector('[data-beam="'+id+'"]').getContext('2d');ctx.clearRect(0,0,1000,140);ctx.strokeStyle='#43566c';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(60,110);ctx.lineTo(940,110);ctx.stroke();for(let x of [60,500,940]){ctx.beginPath();ctx.moveTo(x,107);ctx.lineTo(x,113);ctx.stroke()}ctx.fillStyle='#8095ad';ctx.font='11px sans-serif';ctx.fillText('EMITTER',40,132);ctx.fillText('ENERGY PATH',460,132);ctx.fillText(id==='leech'?'TARGET / RETURN FLOW':'BEAM END',880,132);let f={x:60,y:65,bx:940,by:65,c:color,width,life:reducedMotion?1:.8+.2*Math.sin(t*3),max:1,beamStyle:id,beamHits:id==='laser'||id==='rail'||id==='sails'?[{x:750,y:65}]:[]};drawWeaponBeam(f,t)}requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></html>
